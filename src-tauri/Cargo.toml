[package]
name = "pdfedits-desktop"
version = "0.1.4"
description = "PDFedits — offline desktop PDF editor"
authors = ["Abdullah"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "pdfedits-desktop"
path = "src/main.rs"
